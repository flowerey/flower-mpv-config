# history-bookmark.lua options

# Enable the script
enabled=yes

# Timeout in seconds for the resume prompt
timeout=10

# Periodic save interval in seconds
save_period=30

# Use MD5 hash for bookmark filenames (prevents long names)
hash=yes

# Use mpv's playlist when available
use_playlist=yes

# File extensions to include when scanning directories
whitelist=3gp,amv,asf,avi,bdmv,f4v,flv,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv

# Directories to exclude from history tracking (JSON array)
excluded_dir=[]

# If non-empty, only these directories will have history tracking (JSON array)
included_dir=[]
