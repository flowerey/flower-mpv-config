# auto-sub-sync.lua
# Reapplies a subtitle delay you already set with Ctrl+Left/Right, per file and
# per folder, so the rest of a batch stays in sync. No key binding.

enabled=yes

# Reuse the last delay of a folder for new files in that folder. This is what
# makes an offset carry over to the next episode; turn it off if you keep
# differently-timed releases in one folder.
remember_folder=yes

# Offsets smaller than this (seconds) are ignored.
threshold=0.05

# Show a short message when a remembered delay is applied.
osd=yes

# Maximum number of remembered files. Entries are dropped (oldest are not
# tracked, so arbitrary ones) once the store exceeds this. 0 disables the cap.
max_entries=500
