# Latest here : https://github.com/flowerey/flower-mpv-config

# Quality settings
profile=high-quality
vo=gpu-next
hwdec=auto-copy

scale-antiring=0.6

# Video playback
video-sync=display-resample
interpolation=yes
panscan=0.5
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16

# Audio settings
volume-max=200
audio-pitch-correction=yes
audio-normalize-downmix=yes
audio-channels=auto

# Caching
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=250MiB

# General
keep-open=yes
save-position-on-quit
cursor-autohide=1000
osd-duration=2500
osd-level=1
input-ar-delay=300

# Screenshot settings
screenshot-dir="~/Pictures/mpv" # Pictures\mpv in Windows
screenshot-format=png
screenshot-png-compression=9
screenshot-template="%f-%P-%n"
screenshot-high-bit-depth=no

## Language Priority
## Sub
## Add enm before en for honorifics
slang=en,eng
alang=ja,jpn

## Dub
#slang=zxx,en,eng
#alang=en,eng
#subs-with-matching-audio=forced

# Font override
# If you want to change the font, change sub-font to the font name (not file name!). And put
# your font file in fonts folder. Make you sure put every version (or whatever you call it)
# like Bold, Regular, Italic etc. or it won't work correctly.
# Set sub-ass-override to "no" as we only need to enable it for specific cases
sub-ass-override=no
sub-ass-style-overrides=playresx=1920\,playresy=1080\,Kerning=yes
sub-font="Gandhi Sans" # CHANGE THIS
sub-font-size=50
sub-color="#FFFFFF"
sub-margin-y=40
sub-border-size=2.4
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-shadow-offset=0.75
sub-bold=yes

# Manga profile
[Manga]
profile-desc="Read Manga"
profile-cond=filename and (filename:match('%.cbz$') or filename:match('%.cbr$') or filename:match('%.zip$') or filename:match('%.rar$'))
profile=high-quality
dscale=mitchell
deband=no

# Some other profiles (for WEB streams)
[crunchyroll]
profile-cond=filename:match("SubsPlease") or filename:match("HorribleSubs")
profile-restore=copy
sub-ass-use-video-data=aspect-ratio

[simulcast]
profile-cond=(function(a)for b,c in ipairs(a)do if filename:match(c)then return true end end end)({"SubsPlease","Erai%-raws","Tsundere%-Raws","%-VARYG","HorribleSubs","SubsPlus%+", "Yameii"})
profile-restore=copy
deband=yes

# Resolution-based profiles
[SD-Content]
profile-desc="SD content (below 720p)"
profile-cond=width < 1280
profile-restore=copy
scale-antiring=0.8
deband-iterations=6

[4K-Native]
profile-desc="Native 4K content"
profile-cond=width >= 3840
profile-restore=copy
deband=no
interpolation=no
scale=bilinear

[HDR-Content]
profile-desc="HDR video content"
profile-cond=p.video_params and (p.video_params.gamma == "pq" or p.video_params.gamma == "hlg") and p['current-tracks/video/image'] == false
profile-restore=copy
tone-mapping=spline
target-colorspace-hint=yes
hdr-contrast-recovery=0.3
