# Latest here : https://github.com/flowerey/flower-mpv-config

# Quality settings
profile=high-quality
vo=gpu-next
hwdec=auto-copy

scale-antiring=0.6

# Video playback
video-sync=display-resample
interpolation=yes
# panscan is intentionally left at 0. It crops to fill the window, which eats
# the top/bottom of 4:3 sources and the edges of scope (2.39:1) sources -- and
# that is exactly where ASS typesetting sits. Use `p` (cycle) or the mouse
# wheel to pan manually when you actually want it.
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16

# Audio settings
volume-max=200
audio-pitch-correction=yes
audio-normalize-downmix=yes
audio-channels=auto

# Caching
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=250MiB

# General
keep-open=yes
save-position-on-quit=yes
# Use the customized OSC in scripts/osc.lua
osc=no
cursor-autohide=1000
osd-duration=2500
osd-level=1
input-ar-delay=300

# Screenshot settings
screenshot-dir="~/Pictures/mpv" # Pictures\mpv in Windows
screenshot-format=png
screenshot-png-compression=9
screenshot-template="%f-%P-%n"
screenshot-high-bit-depth=no

## Language Priority
## Sub
## Add enm before en for honorifics
slang=en,eng
alang=ja,jpn

## Dub
#slang=zxx,en,eng
#alang=en,eng
#subs-with-matching-audio=forced

# Font override
# If you want to change the font, change sub-font to the font name (not file name!). And put
# your font file in fonts folder. Make you sure put every version (or whatever you call it)
# like Bold, Regular, Italic etc. or it won't work correctly.
# sub-ass-override=no means ASS typesetting is rendered exactly as authored, and
# it also disables sub-ass-style-overrides entirely -- so nothing here can move
# or rescale a release's own signs and dialogue. The sub-* options below only
# affect plain-text subtitles; press k to force the styling on when you want it.
sub-ass-override=no
sub-font="Gandhi Sans" # CHANGE THIS
sub-font-size=50
sub-color="#FFFFFF"
sub-margin-y=40
sub-border-size=2.4
sub-border-color="#FF000000"
sub-shadow-color="#A0000000"
sub-shadow-offset=0.75
sub-bold=yes

# Manga profile
[Manga]
profile-desc="Read Manga"
profile-cond=filename and (filename:match('%.cbz$') or filename:match('%.cbr$') or filename:match('%.zip$') or filename:match('%.rar$'))
profile-restore=copy
profile=high-quality
dscale=mitchell
deband=no

# Some other profiles (for WEB streams)
[crunchyroll]
profile-cond=filename and (filename:match("SubsPlease") or filename:match("HorribleSubs"))
profile-restore=copy
sub-ass-use-video-data=aspect-ratio

[simulcast]
# SubsPlease/HorribleSubs intentionally left out: [crunchyroll] already matches
# them, and two auto profiles firing on one file would make their options interact.
profile-cond=filename and (function(a)for b,c in ipairs(a)do if filename:match(c)then return true end end end)({"Erai%-raws","Tsundere%-Raws","%-VARYG","SubsPlus%+","Yameii"})
profile-restore=copy
deband=yes

# Resolution-based profiles
[SD-Content]
profile-desc="SD content (below 720p)"
profile-cond=width and width < 1280
profile-restore=copy
scale-antiring=0.8
deband-iterations=6

[4K-Native]
profile-desc="Native 4K content"
profile-cond=width and width >= 3840
profile-restore=copy
deband=no
interpolation=no
# `scale` is the upscaler; 4K is only ever scaled down (or not at all), so the
# cheap path belongs in dscale. The old scale=bilinear here never did anything.
dscale=bilinear

[HDR-Content]
profile-desc="HDR video content"
profile-cond=p.video_params and (p.video_params.gamma == "pq" or p.video_params.gamma == "hlg") and p['current-tracks/video/image'] == false
profile-restore=copy
tone-mapping=spline
target-colorspace-hint=yes
hdr-contrast-recovery=0.3

# Manual profile, not an auto profile: start mpv with --profile=low-power on a
# laptop or weak iGPU (a shortcut/launcher flag, not a line in this file).
[low-power]
profile-desc="Laptop / integrated GPU: no interpolation, cheap scalers, small cache"
profile-restore=copy
interpolation=no
video-sync=audio
deband=no
scale=bilinear
dscale=bilinear
cscale=bilinear
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
