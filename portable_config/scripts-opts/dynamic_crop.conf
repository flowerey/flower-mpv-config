# dynamic_crop.lua options

# Mode: 0=disable, 1=on-demand, 2=one-shot, 3=dynamic-manual, 4=dynamic-auto
mode=4

# Delay in seconds before detection starts
start_delay=0

# Seconds to block changes after a crop is applied
prevent_change_timer=30

# Change prevention: 0=disable, 1=keep-largest, 2=keep-lowest, 3=keep-latest
prevent_change_mode=0

# Window behavior fix: 0=no-fix, 1=fix-no-resize, 2=fix-keep-width, 3=fix-keep-height
fix_windowed_behavior=0

# Crop method: 0=lavfi-crop (ffmpeg filter), 1=video-crop (mpv property)
crop_method=1

# Black threshold 0-255
detect_limit=26

# Rounding for crop dimensions (even number)
detect_round=2

# Seconds for quick crop changes
fast_change_timer=0.2

# Seconds to validate known-ratio metadata
ratio_timer=2

# Seconds to trust new offset values
offset_timer=20

# Seconds to discover new aspect ratios
fallback_timer=40

# Delay between limit adjustments (0=disable)
limit_timer=0.5

# Space-separated aspect ratios
ratios=2.76 2.55 24/9 2.4 2.39 2.35 2.2 2.1 2 1.9 1.85 16/9 5/3 1.5 1.43 4/3 1.25 9/16

# Tolerance for ratio matching (+-pixels, even number)
ratio_tolerance=2

# Tolerance for edge alignment detection
linked_tolerance=2

# Extra time allowance for discontinuous metadata (0.0-1.0)
segmentation=0.5

# Read-ahead mode: 0=disable, 1=fast_change_timer, 2=ratio_timer (experimental)
read_ahead_mode=0

# Frame offset for read-ahead sync
read_ahead_sync=0

# Enable verbose debug logging
debug=no
