# evafast.lua options

# Seconds to jump on key press (set to 0 to disable tap-seek)
seek_distance=5

# Speed increase per interval while fast-forwarding
speed_increase=0.1

# Speed decrease per interval while slowing down
speed_decrease=0.1

# Seconds between speed adjustments
speed_interval=0.05

# Maximum playback speed during fast-forward
speed_cap=2

# Maximum speed when subtitles are displayed (set to "no" for no cap)
subs_speed_cap=1.6

# Look ahead for upcoming subtitles and decelerate before they appear
lookahead=yes

# Show current speed on OSD during fast-forward
show_speed=yes

# Show seek action on OSD
show_seek=yes

# Show speed when fast-forward is activated via toggle key
show_speed_toggled=yes
