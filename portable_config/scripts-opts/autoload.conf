# autoload.lua options

# Disable automatic playlist loading
disabled=no

# Include image files in playlist
images=yes

# Include video files in playlist
videos=yes

# Include audio files in playlist
audio=yes

# Additional image extensions (comma-separated)
additional_image_exts=

# Additional video extensions (comma-separated)
additional_video_exts=

# Additional audio extensions (comma-separated)
additional_audio_exts=

# Ignore hidden files (starting with .)
ignore_hidden=yes

# Only load files of the same type as current file
same_type=yes

# Directory scanning mode: auto, recursive, lazy, ignore
directory_mode=auto

# Patterns to ignore (comma-separated, supports lua patterns)
ignore_patterns=^~,^bak-,%.bak$
