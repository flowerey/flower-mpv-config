# discord-rpc.lua options

# Enable Discord Rich Presence on startup
active=yes

# Key binding to toggle RPC on/off
key_toggle=D

# Fetch episode titles from API (AniList primary, Jikan fallback)
fetch_episode_titles=yes

# Cache duration for API search results (seconds)
search_cache_ttl=300

# Cache duration for episode data (seconds)
episode_cache_ttl=86400

# Minimum delay between API requests (milliseconds)
api_delay=400
