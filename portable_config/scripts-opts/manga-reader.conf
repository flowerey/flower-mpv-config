# manga-reader.lua options

# Auto-start reader for image playlists
auto_start=no

# Path to bookmark file
bookmark_path=~~home/bookmarks.jsonl

# Enable continuous mode by default
continuous=no

# Number of pages in continuous mode
continuous_size=8

# Enable double page mode by default
double=no

# Enable manga (right-to-left) reading direction
manga=yes

# Pan size for up/down scrolling
pan_size=0.05

# Height similarity threshold for double page detection
similar_height_threshold=200

# Pages to skip when pressing Ctrl+arrow
skip_size=10

# Scroll trigger zone (fraction of screen height)
trigger_zone=0.05
