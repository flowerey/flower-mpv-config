# === Cycle between shaders ===
g cycle-values glsl-shaders "~~/shaders/nnedi3-nns128-win8x4.hook" "~~/shaders/ArtCNN_C4F32.glsl" ""

# === Subtitle controls ===
k cycle-values sub-ass-override "force" "no"
[ add sub-scale -0.05
] add sub-scale 0.05
v cycle sub-visibility
j cycle sub
Shift+j cycle sub down
# Subtitle delay
Ctrl+left add sub-delay -0.1
Ctrl+right add sub-delay 0.1
Ctrl+9 set sub-delay 0

# === Audio controls ===
a cycle audio
Shift+a cycle audio down
# Audio delay
Alt+left add audio-delay -0.1
Alt+right add audio-delay 0.1
Alt+9 set audio-delay 0
# Volume
Up add volume 5
Down add volume -5
m cycle mute

# === Video controls ===
d cycle deinterlace
p cycle panscan
WHEEL_UP add panscan 0.05
WHEEL_DOWN add panscan -0.05

# === Screenshots ===
s screenshot
Shift+s no-osd screenshot

# === A-B Loop (handled by abloop.lua) ===
l script-message ab-loop

# === Chapter controls ===
PGUP script-binding betterchapters/chapter_next
PGDWN script-binding betterchapters/chapter_prev

# === Playlist ===
Shift+enter script-binding playlistmanager/showplaylist

# === Stream quality (quality-menu.lua) ===
# The script loads as quality_menu: mpv replaces every non-alphanumeric
# character of a script file name with an underscore.
F script-binding quality_menu/video_formats_toggle
Alt+f script-binding quality_menu/audio_formats_toggle
Ctrl+r script-binding quality_menu/reload

# === Clip export (webm.lua) ===
# Opens the clip encoder; W is also webm.lua's own default keybind.
W script-binding webm/display-webm-encoder

# === Playback extras ===
L cycle-values loop-file "no" "inf"
Shift+L cycle-values loop-playlist "no" "inf"
A cycle-values video-aspect-override "no" "16:9" "4:3" "21:9"
Ctrl+v cycle-values vid "no" "auto"

# === Misc ===
e revert-seek
# C is handled by dynamic-crop.lua (toggle crop modes)
